        <stop offset="0" stop-color="#699ad7"/><stop offset="0.24345198" stop-color="#7eb1dd"/><stop offset="1" stop-color="#7ebae4"/>
      </linearGradient>
      <linearGradient id="nix-dark" gradientUnits="userSpaceOnUse" gradientTransform="translate(864.69589,-1491.3405)" x1="-584.19934" y1="782.33563" x2="-496.29703" y2="937.71399">
        <stop offset="0" stop-color="#415e9a"/><stop offset="0.23168644" stop-color="#4a6baf"/><stop offset="1" stop-color="#5277c3"/>
      </linearGradient>
    </defs>
    <g transform="translate(-156.41121,933.30685)"><g transform="matrix(0.99994059,0,0,0.99994059,-0.06321798,33.188377)" fill-rule="evenodd">
      <path id="nix-light-arm" d="m 309.54892,-710.38827 122.19683,211.67512 -56.15706,0.5268 -32.6236,-56.8692 -32.85645,56.5653 -27.90237,-0.011 -14.29086,-24.6896 46.81047,-80.4901 -33.22946,-57.8257 z" fill="url(#nix-light)"/>
      <use xlink:href="#nix-light-arm" transform="rotate(60,407.11155,-715.78724)"/><use xlink:href="#nix-light-arm" transform="rotate(-60,407.31177,-715.70016)"/><use xlink:href="#nix-light-arm" transform="rotate(180,407.41868,-715.7565)"/>
      <path id="nix-dark-arm" d="m 309.54892,-710.38827 122.19683,211.67512 -56.15706,0.5268 -32.6236,-56.8692 -32.85645,56.5653 -27.90237,-0.011 -14.29086,-24.6896 46.81047,-80.4901 -33.22946,-57.8256 z" fill="url(#nix-dark)"/>
