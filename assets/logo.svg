<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">Supermemory + Nix</title>
  <desc id="desc">The white Supermemory mark on a dark navy tile and the blue Nix snowflake, separated by a neutral plus sign on a transparent background.</desc>
  <!-- Supermemory mark: supermemoryai/supermemory, MIT.
       Source: https://github.com/supermemoryai/supermemory/blob/main/apps/docs/logo/dark.svg
       Original geometry retained; set on a flat dark tile after the app icon so it reads on light and dark pages. -->
  <rect x="60" y="40" width="160" height="160" rx="36" fill="#131a2e"/>
  <svg x="92" y="79.2" width="96" height="81.6" viewBox="0 0 206 168" aria-hidden="true">
    <path fill="#FFFFFF" d="M205.864 66.263h-76.401V0h-24.684v71.897c0 7.636 3.021 14.97 8.391 20.373l62.383 62.777 17.454-17.564-46.076-46.365h58.948v-24.84l-.015-.015ZM12.872 30.517l46.075 46.365H0v24.84h76.4v66.264h24.685V96.089c0-7.637-3.021-14.97-8.39-20.374l-62.37-62.762-17.453 17.564Z"/>
  </svg>
  <path d="M304 120h32m-16-16v32" fill="none" stroke="#8b949e" stroke-width="6" stroke-linecap="round"/>
  <!-- Nix snowflake: Simon Frankau and Tim Cuthbertson, CC BY 4.0.
       https://github.com/NixOS/nixos-artwork/blob/master/logo/nix-snowflake-colours.svg
       Original geometry and colors retained; resized and positioned for this lockup. -->
  <svg x="400" y="20" width="200" height="200" viewBox="0 0 501.56251 501.56249" aria-hidden="true">
